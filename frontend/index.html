<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A beautiful, elegant web calculator with full keyboard support, history log, and smooth animations." />
  <title>Calcify – Elegant Web Calculator</title>

 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

 
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  
  <div class="bg-canvas" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  
  <main class="app-wrapper" role="main">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">⬡</span>
        <span class="logo-text">Calcify</span>
      </div>
      <p class="tagline">Precision at your fingertips</p>
    </header>

  
    <section class="calculator-card" aria-label="Calculator">

      
      <div class="history-panel" id="history-panel" aria-label="Calculation history" aria-live="polite">
        <div class="history-header">
          <span>History</span>
          <button class="history-clear-btn" id="history-clear-btn" aria-label="Clear history" title="Clear history">✕</button>
        </div>
        <ul class="history-list" id="history-list" role="list">
          <li class="history-empty">No calculations yet.</li>
        </ul>
      </div>

      
      <div id="calculator-display"></div>

      
      <div id="calculator-buttons"></div>

    </section>

   
    <p class="keyboard-hint" aria-label="Keyboard shortcut tip">
      <kbd>↑</kbd> Keyboard supported &nbsp;·&nbsp; <kbd>Esc</kbd> Clear &nbsp;·&nbsp; <kbd>H</kbd> Toggle history
    </p>
  </main>

  
  <script src="config/settings.js"></script>
  <script src="js/utils.js"></script>
  <script src="components/display.js"></script>
  <script src="components/buttons.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/keyboard.js"></script>
</body>
</html>
